name: Docker image (sway-gate)

# Triggered on every ``v*`` tag push. Builds the sway-gate image
# (Dockerfile.gate at repo root), pushes to ghcr.io tagged with both
# the version and ``latest``. Consumed by the
# ``sway-gate-docker`` pre-commit hook variant and anyone running
# ``docker run ghcr.io/tenseleyflow/sway-gate`` directly.
#
# The job depends on the ``dlm-sway`` wheel already being on PyPI at
# the matching version — the Dockerfile's ``pip install
# dlm-sway[hf,semsim]==<SWAY_VERSION>`` will fail until PyPI has
# indexed the release. Publish to PyPI first (``twine upload``),
# then push the tag that triggers this job.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sway_version:
        description: "Version to bake into the image (e.g. 0.1.0). Defaults to the tag minus leading 'v'."
        type: string
        required: false

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build + push ghcr.io/tenseleyflow/sway-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve SWAY_VERSION
        id: version
        run: |
          if [ -n "${{ inputs.sway_version }}" ]; then
            v="${{ inputs.sway_version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Resolved SWAY_VERSION=${v}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ``tenseleyflow`` is the GitHub org name; GHCR repo is always
      # ``ghcr.io/<org>/<image>`` in lowercase. Hard-code the lowercase
      # form so a pushed tag from a cased-branch context still targets
      # the right registry path.
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gate
          build-args: |
            SWAY_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/tenseleyflow/sway-gate:v${{ steps.version.outputs.version }}
            ghcr.io/tenseleyflow/sway-gate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test pulled image
        run: |
          docker run --rm \
            ghcr.io/tenseleyflow/sway-gate:v${{ steps.version.outputs.version }} \
            --version
