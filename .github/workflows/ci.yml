name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly slow-lane run at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      regenerate_goldens:
        description: "Regenerate tests/golden/expected_<platform>.json from the current run (S18)."
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# F08 (Audit 03) — opt into Node.js 24 for javascript-based actions
# (actions/checkout@v4, astral-sh/setup-uv@v6, dorny/paths-filter@v3
# all ship Node 20 today; deadline is June 2026). This env applies
# workflow-wide and silences the deprecation warning block each job
# log currently carries. Remove once every action we pull bumps to
# Node 24 in its own tag and we can drop the env override.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fast-lane:
    # Unit tests + lint + type check. Runs on every push, every PR.
    name: fast (unit + lint + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv
        run: uv venv --python 3.11 .venv

      # ``uv sync`` resolves every optional-dependency group to write a
      # universal lockfile, which fails because ``[dlm]`` depends on
      # the not-yet-published ``dlm`` package. ``uv pip install -e``
      # only installs what's named — matches the README's documented
      # install path and keeps CI honest about what users see.
      - name: Install dev deps (core only — no heavy extras)
        run: uv pip install -e "." --group dev

      - name: ruff check
        run: uv run --no-sync ruff check src tests

      - name: ruff format check
        run: uv run --no-sync ruff format --check src tests

      - name: mypy strict
        run: uv run --no-sync mypy src

      - name: pytest (unit)
        run: uv run --no-sync pytest tests/unit --no-header -v

  changes:
    # Decides whether the slow lane runs on this PR. A backend touch or
    # an integration-test touch triggers it; otherwise the nightly cron
    # is the sole slow-lane driver.
    name: detect backend/integration changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend_touched: ${{ steps.filter.outputs.backend_touched }}
      golden_touched: ${{ steps.filter.outputs.golden_touched }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend_touched:
              - 'src/dlm_sway/backends/**'
              - 'tests/integration/**'
              - 'pyproject.toml'
            golden_touched:
              - 'tests/golden/**'
              - 'src/dlm_sway/core/golden.py'
              - 'tests/integration/test_determinism_golden.py'

  slow-lane:
    # Integration tests (slow + online). Runs on: schedule, manual
    # dispatch, or when the change-filter flags a backend / integration
    # diff. Skipped on vanilla PRs that only touch probes / docs.
    name: slow (integration, HF backend)
    needs: [changes]
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.backend_touched == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv
        run: uv venv --python 3.11 .venv

      # ``[semsim]`` pulls scikit-learn + sentence-transformers; without
      # it, test_cluster_kl_e2e.py (S16) silently skips with
      # "No module named 'sklearn'". The cluster_kl probe is a shipped
      # primitive — its integration test belongs in the slow lane.
      - name: Install dev + hf + semsim extras
        run: uv pip install -e ".[hf,semsim]" --group dev

      - name: pytest (slow + online)
        run: uv run --no-sync pytest tests/integration -m "slow or online" --no-header -v

  determinism-golden:
    # Cross-platform determinism golden (S18). Runs on a matrix
    # (ubuntu-latest + macos-latest) when the golden fixture or its
    # comparator changes, plus on schedule + dispatch. macOS runners
    # are 10× Linux cost; keep the test scope minimal (2 probes) so
    # each leg stays under 5 min.
    name: determinism-golden (${{ matrix.os }})
    needs: [changes]
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.golden_touched == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
      # ``workflow_dispatch`` carries a boolean input that toggles
      # regen mode. Every other trigger writes an empty string and
      # the test asserts (default mode).
      SWAY_UPDATE_GOLDENS: "${{ inputs.regenerate_goldens && '1' || '' }}"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv
        run: uv venv --python 3.11 .venv

      - name: Install dev + hf extras
        run: uv pip install -e ".[hf]" --group dev

      - name: pytest (determinism golden)
        run: uv run --no-sync pytest tests/integration/test_determinism_golden.py -m "slow or online" --no-header -v

      - name: Upload regenerated golden
        if: ${{ inputs.regenerate_goldens == true }}
        uses: actions/upload-artifact@v4
        with:
          name: expected-${{ matrix.os }}
          path: tests/golden/expected_*.json
          if-no-files-found: error
